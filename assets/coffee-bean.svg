<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70">
  <defs>
    <radialGradient id="beanShade" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6E381C"/>
      <stop offset="60%" stop-color="#3B1C0C"/>
      <stop offset="100%" stop-color="#1D0A03"/>
    </radialGradient>
    <linearGradient id="creaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120502"/>
      <stop offset="50%" stop-color="#220B04"/>
      <stop offset="100%" stop-color="#0B0201"/>
    </linearGradient>
    <filter id="beanShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#1E0D05" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- Bean outer body -->
  <path d="M12 35 C12 14, 32 4, 52 4 C76 4, 92 18, 92 35 C92 54, 74 66, 50 66 C26 66, 12 54, 12 35 Z" fill="url(#beanShade)" filter="url(#beanShadow)"/>
